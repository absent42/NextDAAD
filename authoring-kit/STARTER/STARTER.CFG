REM ---- STARTER game settings ----
REM Read after CONFIG.BAT and before CONFIG.local.BAT. Holds only the
REM settings of this game; remove the REM from a line to use it. GAME does
REM not belong here - select the game in CONFIG.local.BAT.

REM 1 = ZX0-compress location graphics; 0 = raw NX2/NXI (the default).
REM SET COMPRESS=0

REM Text columns: blank = 80, or 40 for the double-width 40-column mode.
REM SET COLS=

REM Video shape for VIDEO\NNN.mp4: blank = full, or a preset, WIDTHxHEIGHT
REM or a display-aspect number - see docs\video.html.
REM SET VIDASPECT=

REM Frames per second for encoded cutscenes: blank = 25.
REM SET VIDFPS=

REM Extra videnc options applied to every encode of this game.
REM SET VIDOPTS=

REM Per-video overrides (VIDOPTS_NNN), tuned for the demo clips; vidtune
REM saves here. Delete them when you replace 001.mp4 and 002.mp4.
SET VIDOPTS_002=--fps 12.5 --dither 0.0 --tile-slack 0.5 --direct
SET VIDOPTS_001=--shape 16:9 --dither 0.25
