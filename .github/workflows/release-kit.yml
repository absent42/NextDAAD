name: Release authoring kit

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Zip authoring kit (contents at archive root)
        run: |
          cd authoring-kit
          zip -r "../NextDAAD-AuthoringKit-${{ github.event.release.tag_name }}.zip" . -x ".gitignore"

      - name: Attach the kit to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "NextDAAD-AuthoringKit-${{ github.event.release.tag_name }}.zip" \
            --clobber
