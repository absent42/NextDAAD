name: Extern audit

# Runs tests\audit-externs.ps1 - the same script contributors run
# locally - on every PR touching the externs tree. The repository does
# not carry the toolchain (tools\ is local-only), so a pinned sjasmplus
# release is downloaded per run; keep the version aligned with the
# tools\sjasmplus\ the project uses locally.

on:
  pull_request:
    paths:
      - 'authoring-kit/externs/**'
      - 'authoring-kit/xbn.inc'
      - 'tests/audit-externs.ps1'
  workflow_dispatch:

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch pinned sjasmplus
        shell: pwsh
        run: |
          $ver = '1.23.1'
          $url = "https://github.com/z00m128/sjasmplus/releases/download/v$ver/sjasmplus-$ver.win.zip"
          Invoke-WebRequest -Uri $url -OutFile sjasmplus.zip
          Expand-Archive sjasmplus.zip -DestinationPath sjasmplus-dist
          $exe = Get-ChildItem sjasmplus-dist -Recurse -Filter sjasmplus.exe | Select-Object -First 1
          if (-not $exe) { throw 'sjasmplus.exe not found in the release archive' }
          "SJASMPLUS_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Run the extern audit
        shell: pwsh
        run: powershell -File tests\audit-externs.ps1 -SjasmPlus "$env:SJASMPLUS_EXE"
